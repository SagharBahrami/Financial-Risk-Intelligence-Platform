# Fraud detection - Bank Account Fraud (BAF) dataset

data:
  raw_path: data/raw/fraud_baf/Base.csv
  interim_path: data/interim/fraud_baf.parquet
  train_path: data/processed/fraud_train.parquet
  test_path: data/processed/fraud_test.parquet

target: fraud_bool
time_column: month

categorical_columns:
  - payment_type
  - employment_status
  - housing_status
  - source
  - device_os

drop_columns:
  - device_fraud_count  # constant (always 0) in Base.csv

features:
  # Negative values in these columns mean "missing" (BAF datasheet)
  missing_as_negative:
    - prev_address_months_count
    - current_address_months_count
    - bank_months_count
    - session_length_in_minutes
    - device_distinct_emails_8w
    - intended_balcon_amount

# Time-based split: train on the past, test on the future (same as the BAF paper)
#   months 0-3  fit models while tuning          (tune.py)
#   month  4    choose hyperparameters           (tune.py)
#   months 0-4  refit the final model            (train.py)
#   month  5    fit the calibrator, choose the decision threshold  (train.py)
#   months 6-7  final test of the frozen model, never used for any choice
split:
  train_months: [0, 1, 2, 3, 4, 5]  # saved to fraud_train.parquet and split further below
  test_months: [6, 7]               # saved to fraud_test.parquet

evaluation:
  max_fpr: 0.05  # the decision threshold gives the highest recall with at most 5% false positives

# Final model (src/risk_platform/fraud/train.py)
training:
  fit_months: [0, 1, 2, 3, 4]
  calibration_months: [5]
  calibration_method: auto                       # none, sigmoid (Platt scaling), isotonic, or auto:
                                                 # the lowest out-of-fold Brier score on the calibration months
                                                 # among methods that keep the ranking (max_recall_loss)
  compare_methods: [none, sigmoid, isotonic]     # compared by cross-validation on the calibration months
  max_recall_loss: 0.005                         # auto: a method may lose at most this much recall at the FPR
                                                 # limit compared with "none" (0.005 = half a percentage point)

mlflow:
  experiment: fraud

# Model versioning (src/risk_platform/fraud/register.py)
registry:
  model_name: fraud-detector
  # A new version becomes "champion" only if this is higher. Measured on month 5 before calibration
  # (nothing is fitted on these scores), so the test months are never used to select a model.
  # Versions without this metric were selected another way and are not compared automatically.
  metric: cal_recall_at_5pct_fpr

# Model used by train.py when --model is not given
model: lightgbm

# Hyperparameters per model (see src/risk_platform/fraud/models.py)
models:
  logistic_regression:
    C: 1.0
    class_weight: balanced
    max_iter: 1000
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 1.0
    subsample_freq: 1
    colsample_bytree: 1.0
    reg_lambda: 0.001
    random_state: 42
    verbose: -1
  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    tree_method: hist
    random_state: 42

# Hyperparameter search with Optuna (src/risk_platform/fraud/tune.py)
tuning:
  fit_months: [0, 1, 2, 3]
  validation_months: [4]  # calibration and test months stay unseen
  metric: recall_at_5pct_fpr
  n_trials: 30
  report_every: 100  # boosting rounds between pruning checks (Hyperband)
